kind: pipeline
type: docker 
name: deploy_dev
trigger:
  branch:
  - main

node:
  environment: ryali

steps:
- name: build
  image: node:latest
  commands:
    - ls -la /bonfire
    - npm install
    - npm run build
    - ls -l ./
    - ls -l ./build
    - rm -rf /bonfire/*
    - mv ./build/* /bonfire/
    - ls -l /bonfire
    
